name: 광장 작품 스냅샷 갱신

# 광장 API 를 받아 dist/works.json 을 다시 만들고, 바뀌었으면 커밋한다.
# 서버에서 git pull 하면 최신 작품이 링크 페이지에 반영된다.
#
# 브라우저가 아니라 여기(GitHub 서버)에서 부르므로 CORS 제약이 없다.
# 광장 쪽은 아무것도 건드리지 않는다.

on:
  schedule:
    - cron: '0 0 * * *'   # 매일 09:00 KST (00:00 UTC)
  workflow_dispatch:       # 필요할 때 Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: works-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 광장 API 에서 작품 받아오기
        run: node scripts/build-works.mjs

      - name: 바뀌었으면 커밋
        run: |
          if git diff --quiet -- dist/works.json; then
            echo "변경 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/works.json
          git commit -m "작품 스냅샷 갱신 ($(date -u '+%Y-%m-%d'))"
          git push
